version: "3.8"

services:
  wattsmart:
    build:
      context: .
      dockerfile: Dockerfile
    image: wattsmart:2.0.0
    container_name: wattsmart_app
    restart: unless-stopped
    ports:
      - "5000:7860"
      - "7860:7860"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=7860
      - SECRET_KEY=production-wattsmart-secret-key-change-in-prod
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
